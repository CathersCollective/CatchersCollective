<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1536 864" role="img" aria-labelledby="title desc">
  <title id="title">Catcher's Collective horizontal logo</title>
  <desc id="desc">Gold Catcher's Collective wordmark with a home plate icon.</desc>
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8e7bd"/>
      <stop offset="0.22" stop-color="#b98f49"/>
      <stop offset="0.48" stop-color="#fff0c6"/>
      <stop offset="0.74" stop-color="#b88c47"/>
      <stop offset="1" stop-color="#f5dda4"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
  </defs>
  <g filter="url(#shadow)">
    <g fill="url(#gold)" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif">
      <text x="768" y="350" font-size="172" font-weight="700" letter-spacing="20">CATCHER'S</text>
      <text x="768" y="500" font-size="86" font-weight="700" letter-spacing="28">COLLECTIVE</text>
    </g>
    <g fill="none" stroke="url(#gold)" stroke-width="8" stroke-linecap="square">
      <path d="M292 470h132"/>
      <path d="M1112 470h132"/>
      <path d="M648 582h240v110l-120 110-120-110z" stroke-linejoin="miter"/>
    </g>
  </g>
</svg>
